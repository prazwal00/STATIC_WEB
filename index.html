  {
    "@context": "https://schema.org",

  <!-- Apply theme before first paint to avoid flash -->
  <script>
    (function () {
      var saved = localStorage.getItem('theme');
      var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Inter:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #FAFAFA;
      --text: #1A1A1A;
      --accent: #E63946;
      --secondary: #6B6B6B;
      --glow: rgba(230, 57, 70, 0.07);
    }

    [data-theme="dark"] {
      --bg: #0A0A0A;
      --text: #FAFAFA;
      --secondary: #A0A0A0;
      --glow: rgba(230, 57, 70, 0.09);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      display: grid;
      place-items: center;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      padding: clamp(1.5rem, 5vw, 3rem);
      padding-top: max(clamp(1.5rem, 5vw, 3rem), env(safe-area-inset-top));
      padding-bottom: max(clamp(1.5rem, 5vw, 3rem), env(safe-area-inset-bottom));
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    /* ---------- Theme toggle ---------- */

    .theme-toggle {
      position: fixed;
      top: max(1.25rem, env(safe-area-inset-top));
      right: max(1.25rem, env(safe-area-inset-right));
      min-height: 44px;
      min-width: 4.6rem; /* fits both "Dark" and "Light" so the button never resizes */
      background: transparent;
      border: 1px solid var(--secondary);
      border-radius: 2rem;
      padding: 0.5rem 1.1rem;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, transform 0.15s ease;
    }

    /* Hover only where hover exists — prevents the style sticking after a tap on touch screens */
    @media (hover: hover) {
      .theme-toggle:hover {
        background-color: var(--text);
        border-color: var(--text);
        color: var(--bg);
      }
    }

    .theme-toggle:active {
      transform: scale(0.96);
    }

    @media (max-width: 480px) {
      .theme-toggle {
        top: max(1rem, env(safe-area-inset-top));
        right: max(1rem, env(safe-area-inset-right));
        min-width: 4.2rem;
        padding: 0.45rem 0.9rem;
        font-size: 0.62rem;
      }
    }

    /* ---------- Hero ---------- */

    .container {
      text-align: center;
      position: relative;
    }

    /* Soft breathing accent glow behind the name */
    .container::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(70vw, 480px);
      aspect-ratio: 1;
      transform: translate(-50%, -55%);
      background: radial-gradient(circle, var(--glow) 0%, transparent 65%);
      pointer-events: none;
      z-index: -1;
      animation: breathe 7s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.6; transform: translate(-50%, -55%) scale(1); }
      50%      { opacity: 1;   transform: translate(-50%, -55%) scale(1.08); }
    }

    .name {
      font-family: 'Bricolage Grotesque', 'Inter', sans-serif;
      font-size: clamp(2.4rem, 8.5vw, 4rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.05;
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }

    /* ---------- Rotating tagline (single line, fits at every width) ---------- */

    .tagline-slot {
      display: grid;
      place-items: center;
      min-height: 1.8em;
      margin-top: 1.25rem;
    }

    .tagline {
      grid-area: 1 / 1;
      font-size: clamp(0.65rem, 2.4vw, 1rem);
      font-weight: 500;
      color: var(--secondary);
      letter-spacing: clamp(0.08em, 0.6vw, 0.22em);
      text-transform: uppercase;
      white-space: nowrap;
      line-height: 1.5;
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.45s ease, transform 0.45s ease;
    }

    .tagline.is-leaving {
      opacity: 0;
      transform: translateY(-6px);
    }

    .tagline.is-entering {
      opacity: 0;
      transform: translateY(6px);
      transition: none;
    }

    /* ---------- Social links ---------- */

    .social-links {
      display: flex;
      gap: clamp(1.25rem, 4vw, 2rem);
      justify-content: center;
      margin-top: clamp(2rem, 6vw, 3rem);
    }

    .social-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      transition: transform 0.3s ease, background-color 0.3s ease;
    }

    .social-link:hover {
      transform: translateY(-3px);
    }

    .social-link svg {
      width: 22px;
      height: 22px;
      fill: var(--text);
      transition: fill 0.3s ease;
    }

    .social-link.linkedin:hover {
      background-color: rgba(0, 119, 181, 0.1);
    }

    .social-link.linkedin:hover svg {
      fill: #0077B5;
    }

    .social-link.twitter:hover {
      background-color: rgba(128, 128, 128, 0.15);
    }

    .social-link.instagram:hover {
      background-color: rgba(225, 48, 108, 0.1);
    }

    .social-link.instagram:hover svg {
      fill: #E1306C;
    }

    /* ---------- Entrance stagger ---------- */

    .reveal {
      opacity: 0;
      transform: translateY(16px);
      animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .reveal:nth-child(1) { animation-delay: 0.05s; }
    .reveal:nth-child(2) { animation-delay: 0.2s; }
    .reveal:nth-child(3) { animation-delay: 0.35s; }

    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }

    /* Name plays its entrance first, then hands off to the float */
    .name.reveal {
      animation:
        rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.05s forwards,
        float 6s ease-in-out 0.9s infinite;
    }

    /* ---------- Accessibility ---------- */

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 4px;
    }

    .social-link:focus-visible {
      border-radius: 50%;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .reveal { opacity: 1; transform: none; }
    }

    /* Very small screens: tighten the tagline so the longest line still fits */
    @media (max-width: 360px) {
      .tagline {
        font-size: 0.6rem;
        letter-spacing: 0.05em;
      }
    }
  </style>
</head>
<body>
  <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle color theme">
    <span class="mode-text">Dark</span>
  </button>

  <main class="container">

    <div class="tagline-slot reveal">

    <nav class="social-links reveal" aria-label="Social links">

          <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>

      <a href="https://www.linkedin.com/in/prazwal00" target="_blank" rel="noopener noreferrer" class="social-link linkedin" aria-label="LinkedIn">

      </a>
    </nav>
  </main>

  <script>
    // ----- Theme toggle -----
    var themeColorMeta = document.querySelector('meta[name="theme-color"]');

    function syncThemeUI() {
      var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      document.querySelector('.mode-text').textContent = isDark ? 'Light' : 'Dark';
      themeColorMeta.setAttribute('content', isDark ? '#0A0A0A' : '#FAFAFA');
    }

    function toggleTheme() {
      var html = document.documentElement;
      var next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      syncThemeUI();
    }

    // Follow system preference live, unless the visitor has chosen manually
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
      if (!localStorage.getItem('theme')) {
        document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
        syncThemeUI();
      }
    });

    syncThemeUI();

    // ----- Rotating tagline (smooth crossfade, no layout shift) -----
    var taglines = [
      'Troubleshooter',
      'ICT Ops & Infrastructure Specialist',
      'Automation Enthusiast',
      'MBA Graduate',
      'BSc(Hons) Networking and IT Security',
      'WLV Exchange Fellow 2024'
    ];
    var taglineEl = document.querySelector('.tagline');
    var index = 0;
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    setInterval(function () {
      if (document.hidden) return;
      index = (index + 1) % taglines.length;

      if (reduceMotion) {
        taglineEl.textContent = taglines[index];
        return;
      }

      taglineEl.classList.add('is-leaving');
      setTimeout(function () {
        taglineEl.textContent = taglines[index];
        taglineEl.classList.remove('is-leaving');
        taglineEl.classList.add('is-entering');
        // force reflow so the entering state applies before transitioning in
        void taglineEl.offsetHeight;
        taglineEl.classList.remove('is-entering');
      }, 450);
    }, 3400);
  </script>
</body>
